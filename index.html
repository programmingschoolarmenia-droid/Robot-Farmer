<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Բրիջիի ֆերման</title>
  <link rel="icon" type="image/png" href="assets/bridgy/bridgy-head.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="vendor/codemirror/addon/show-hint.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/dialog.css">
  <link rel="stylesheet" href="css/tree.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/javascript.js"></script>
  <script src="vendor/codemirror/addon/show-hint.js"></script>
  <script src="vendor/codemirror/addon/matchbrackets.js"></script>
  <script src="vendor/codemirror/addon/closebrackets.js"></script>
  <script src="vendor/codemirror/addon/active-line.js"></script>
  <script src="vendor/codemirror/addon/comment.js"></script>
  <script>
    // Flaky internet: a file that fails to load would leave «Բեռնվում է…» forever, so say what to do.
    function loadProblem(failed) {
      var text = document.querySelector('#screen-loading:not([hidden]) .loading-text');
      if (text) text.textContent = failed ? 'Խաղը լրիվ չբեռնվեց (համացանցը ընդհատվեց)։ Սեղմիր F5՝ նորից փորձելու համար։' : 'Երկար է տևում… Եթե չի բեռնվում, սեղմիր F5։';
    }
    setTimeout(function () { if (!window.bridgysFarm) loadProblem(false); }, 20000);
  </script>
  <script type="module" src="js/main.js" onerror="loadProblem(true)"></script>
</head>
<body>
  <div id="app">
    <section class="screen screen-loading" id="screen-loading">
      <img class="loading-bridgy" src="assets/bridgy/bridgy.png" alt="">
      <p class="loading-text">Բեռնվում է…</p>
    </section>
  </div>
  <noscript>Խաղի համար անհրաժեշտ է JavaScript։</noscript>
</body>
</html>
