<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<title>Sprite preview</title>
<style>
  body { font: 13px/1.3 system-ui, sans-serif; background: #e7f0fb; margin: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; background: #fff; border: 2px solid #c9d6ea; border-radius: 8px; padding: 6px; text-align: center; width: 92px; }
  figure.dark { background: #a0694e; }
  img { image-rendering: pixelated; width: 64px; height: 64px; display: block; margin: 0 auto 4px; }
  figcaption { font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
<h3>Sprites (dev tool)</h3>
<div class="grid" id="grid"></div>
<script type="module">
  import { SpriteBook } from '../js/ui/sprites.js';
  const settings = await (await fetch('../config/settings.json')).json();
  const book = new SpriteBook();
  // sprite paths in the book are relative to the game root
  const base = document.createElement('base');
  base.href = '../';
  document.head.prepend(base);
  await book.load(settings);
  const grid = document.getElementById('grid');
  for (const name of book.sprites.keys()) {
    const fig = document.createElement('figure');
    if (/^(bush|tree|carrot|cactus|grass|pumpkin|sunflower|dead)/.test(name)) fig.className = 'dark';
    const img = document.createElement('img');
    img.src = book.url(name, 4);
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    fig.append(img, cap);
    grid.append(fig);
  }
  document.body.dataset.ready = '1';
</script>
</body>
</html>
