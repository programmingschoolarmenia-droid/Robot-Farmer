# Android app for Google Play: a signed AAB with the live game (npm run sync, not the test build).
# Only by hand: Actions → Android release → Run workflow. It needs the 4 secrets in mobile/README.md.
# The AAB is in the run's "bridgys-farm-aab" download; its versionCode is the run number.
name: Android release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the signed AAB
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The upload key secrets are missing (see mobile/README.md)."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
          npm ci
          npm run sync
          cd android && ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bridgys-farm-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
