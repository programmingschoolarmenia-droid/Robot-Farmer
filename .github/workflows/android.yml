# Android app (mobile/): builds a test APK (no live Firebase keys inside) and plays it on an Android
# emulator with mobile/android-test.mjs. Runs when mobile/ changes, or by hand: Actions → Android → Run workflow.
# The report, screenshots and the APK are in the run's "android-report" download.
name: Android
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the test APK
        working-directory: mobile
        run: |
          npm ci
          npm run web:test
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play the app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          script: node mobile/android-test.mjs mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android-report
      - if: always()
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android-report/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-report
          path: mobile/android-report
